<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily | Zimu Han's Blog</title>
  <meta name="description" content="Personal reflections and everyday moments by Zimu Han." />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../blog.css?v=20261121-notes" />
</head>
<body class="blog-page">
<div class="container">
  <header class="blog-header">
    <a class="blog-author" href="../../">Zimu Han</a>
    <div class="blog-header-actions">
  <a class="blog-home" href="../../">Homepage</a>
      <button class="blog-button" id="blog-login" type="button" aria-label="使用 GitHub 登录">登录</button>
      <button class="blog-button" id="blog-logout" type="button" hidden>退出</button>
    </div>
  </header>

  <section class="blog-account" aria-label="Blog 账户" lang="zh-CN">
    <div class="blog-account-summary">
      <img id="blog-account-avatar" width="40" height="40" alt="" hidden />
      <div><p id="blog-greeting">欢迎来到我的 Blog</p><p id="blog-account-note">公开笔记无需登录；Friend 可以阅读“需要权限”的笔记。</p></div>
    </div>
    <div class="blog-account-actions">
      <button class="blog-button" id="blog-friend-apply" type="button" hidden>申请 Friend 权限</button>
      <a class="blog-button" id="blog-admin-link" href="../admin/" hidden>管理 Blog</a>
    </div>
    <p id="blog-request-note" class="blog-auth-message" hidden>申请会将 GitHub 资料和绑定邮箱提供给作者，批准后通过该邮箱通知。</p>
    <p class="blog-auth-message" id="blog-auth-message" role="status" aria-live="polite"></p>
  </section>

  <main id="main-content">
    <div class="blog-intro">
      <h1>Daily</h1>
      <p>Personal reflections and small moments beyond research.</p>
    </div>

    <nav class="blog-nav" aria-label="Blog navigation">
      <a href="../">Overview</a>
      <a href="../academic/">Academic</a>
      <a href="./" aria-current="page">Daily</a>
    </nav>

    <section aria-labelledby="posts-heading">
      <h2 class="blog-list-title" id="posts-heading">Posts</h2>
      <!-- Lists are filtered by the server according to the current reader. -->
      <ul class="blog-post-list" id="blog-notes-list" data-category="daily" lang="zh-CN"></ul>
      <p class="blog-auth-message" id="notes-status" role="status" lang="zh-CN">正在读取笔记…</p>
      <div class="blog-account-actions" lang="zh-CN">
        <button class="blog-button" id="notes-more" type="button" hidden>加载更多</button>
        <button class="blog-button" id="notes-refresh" type="button">刷新笔记</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© Zimu Han</p>
  </footer>
</div>
<script type="module" src="../auth.js?v=20261121-notes"></script>
<script type="module" src="../notes.js?v=20261121-notes2"></script>
</body>
</html>
